name: Hermes Agent Upstream
version: 0.3.6
slug: hermes_agent_upstream
description: Minimal HAOS wrapper around the official NousResearch Hermes Agent image
url: https://github.com/cavamora/hassio-addons/tree/main/hermes-agent-upstream
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
panel_icon: mdi:robot-outline
panel_title: Hermes Agent
map:
  - addon_config:rw
  - all_addon_configs:ro
  - media:rw
  - share:rw
ingress: true
ingress_port: 9119
ingress_stream: true
webui: http://[HOST]:[PORT:9119]
ports:
  9119/tcp: 9119
ports_description:
  9119/tcp: Hermes Dashboard (direct LAN access)
options:
  dashboard_username: hermes
  dashboard_password: ""
  dashboard_terminal: true
schema:
  dashboard_username: str
  dashboard_password: password
  dashboard_terminal: bool
